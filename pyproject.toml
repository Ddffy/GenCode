[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gencode"
version = "0.3.0"
description = "GenCode: a small local coding agent for OpenAI-compatible, Anthropic-compatible, and DeepSeek models"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0.0",
  "textual>=0.86.0",
  "tzdata>=2024.1; platform_system == 'Windows'",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
gencode = "gencode.cli:main"
gencode-tui = "gencode.tui.main:main"

[project.optional-dependencies]
map = ["tree-sitter>=0.22", "tree-sitter-language-pack>=0.9.0"]
rag = ["sentence-transformers>=3.0.0"]
all = [
  "tree-sitter>=0.22",
  "tree-sitter-language-pack>=0.9.0",
  "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["gencode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".gencode",
  ".venv",
  ".worktrees",
  "_local",
  "artifacts",
  "build",
  "dist",
  "examples",
  "fixtures",
]
